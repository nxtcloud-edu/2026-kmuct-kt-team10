# nginx 리버스 프록시 설정
# 배치 위치(Amazon Linux): /etc/nginx/conf.d/collab-meeting.conf
# 목적: 80 포트로 들어온 요청을 내부 3000 포트의 Node 서버로 전달.
#       WebSocket(ws) 업그레이드도 함께 프록시한다.
#
# 사용법(EC2 안에서):
#   sudo cp deploy/nginx-collab-meeting.conf /etc/nginx/conf.d/collab-meeting.conf
#   sudo nginx -t          # 문법 검사
#   sudo systemctl enable --now nginx
#   sudo systemctl restart nginx

server {
    listen 80;
    server_name _;   # 도메인이 있으면 여기에 도메인 입력 (예: meet.example.com)

    # 업로드 파일 크기 한도 (앱은 20MB 제한 → 여유있게 25M)
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket 업그레이드 헤더 (실시간 알림에 필수)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }
}
